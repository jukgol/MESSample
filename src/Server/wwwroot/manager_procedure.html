<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES Procedure Manager - Oracle DB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/logger-service.js"></script>
    <style>
        /* 페이지 특화: 배경 중앙 정렬 해제 (상단 정렬로 변경) */
        body { align-items: flex-start; padding-top: 5vh; }
    </style>
</head>
<body>
    <div class="decoration blob-1"></div>
    <div class="decoration blob-2"></div>

    <div id="manager-container" class="dashboard-container" style="display: flex;">
        <!-- Sidebar Menu -->
        <aside class="sidebar glass-card">
            <div class="sidebar-header">
                <h3>Procedure Manager</h3>
            </div>
            <nav class="menu">
                <button class="menu-item active" onclick="switchTab('search')">
                    <span class="icon">🔍</span>
                    <span>프로시저 조회</span>
                </button>
                <button class="menu-item" onclick="switchTab('create')">
                    <span class="icon">➕</span>
                    <span>프로시저 생성</span>
                </button>
                <button class="menu-item" onclick="switchTab('delete')">
                    <span class="icon">🗑️</span>
                    <span>프로시저 삭제</span>
                </button>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-outline-sm" onclick="location.href='index.html'">연결 끊기 (Exit)</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content glass-card">
            <div class="content-header">
                <h2 id="current-tab-title">프로시저 조회</h2>
                <p class="subtitle" id="current-tab-desc">데이터베이스에 등록된 프로시저 목록을 확인합니다.</p>
            </div>
            <div class="content-body" id="main-display">
                <p>선택된 메뉴의 내용이 여기에 표시됩니다.</p>
            </div>
        </main>
    </div>

    <script src="js/manager_procedure.js"></script>
</body>
</html>
