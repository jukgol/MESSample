<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES Table Manager - Oracle DB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/logger-service.js"></script>
    <style>
        body { align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .dashboard-container { height: 85vh; width: 90vw; max-width: 1200px; display: flex; overflow: hidden; }
        
        .main-content { display: flex; flex-direction: column; flex: 1; height: 100%; overflow: hidden; padding: 0; }
        
        .content-header { padding: 30px 40px 10px 40px; flex-shrink: 0; }
        .content-header h2 { margin: 0; font-size: 1.6rem; color: #fff; }
        .content-header .subtitle { margin: 5px 0 0 0; font-size: 0.95rem; opacity: 0.6; }

        .table-scroll-area { 
            flex: 1; 
            overflow: auto; 
            margin: 0 40px 10px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.1);
            border-radius: 12px;
        }
        .table-list { width: 100%; border-collapse: collapse; table-layout: auto; } 
        .table-list th { 
            padding: 12px 15px; text-align: left; background: rgba(255, 255, 255, 0.08); 
            color: #818cf8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            position: sticky; top: 0; z-index: 10;
        }
        .table-list td { padding: 10px 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.03); color: rgba(255, 255, 255, 0.7); font-size: 0.85rem; white-space: nowrap; }
        .table-list tr:hover td { background: rgba(255, 255, 255, 0.04); color: #fff; }

        /* 체크박스 열 고정 너비 */
        .col-check { width: 50px; text-align: center !important; }
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }

        /* 하단 액션 바 */
        .selection-bar {
            margin: 0 40px 30px 40px;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            display: none; /* 선택 시에만 표시 */
            justify-content: space-between;
            align-items: center;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .selection-info { font-size: 0.9rem; color: #818cf8; font-weight: 500; }
        .btn-delete { 
            background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.3); 
            color: #ef4444; padding: 8px 20px; border-radius: 8px; width: auto; font-size: 0.85rem; margin-top: 0;
        }
        .btn-delete:hover { background: #ef4444; color: #fff; }

        .table-scroll-area::-webkit-scrollbar { width: 6px; height: 6px; }
        .table-scroll-area::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        .empty-message { text-align: center; padding: 100px 0; color: rgba(255, 255, 255, 0.1); font-style: italic; }

        .menu-item { justify-content: flex-start; padding: 12px 20px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="decoration blob-1"></div>
    <div class="decoration blob-2"></div>

    <div id="manager-container" class="dashboard-container">
        <aside class="sidebar glass-card">
            <div class="sidebar-header"><h3>Table Manager</h3></div>
            <nav class="menu" id="table-list-menu">
                <p style="padding: 20px; color: rgba(255,255,255,0.2); font-size: 0.8rem; font-style: italic;">조회 중...</p>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-outline-sm" onclick="location.href='debug_navigator.html'">뒤로 가기 (Back)</button>
            </div>
        </aside>

        <main class="main-content glass-card">
            <div class="content-header">
                <h2 id="current-table-title">테이블을 선택해 주세요</h2>
                <p class="subtitle" id="current-table-subtitle">왼쪽 목록에서 데이터를 조회할 테이블을 클릭하세요.</p>
            </div>

            <div class="table-scroll-area" id="table-scroll-container">
                <table class="table-list" id="data-table">
                    <thead id="data-table-head"></thead>
                    <tbody id="data-table-body">
                        <tr><td class="empty-message">데이터가 없습니다.</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- [추가] 선택 액션 바 -->
            <div id="selection-bar" class="selection-bar">
                <div class="selection-info">
                    <span id="selected-count">0</span>개 항목 선택됨
                </div>
                <button class="btn-delete" onclick="handleDeleteSelected()">선택 삭제 (Delete)</button>
            </div>
        </main>
    </div>

    <script src="js/manager_table.js"></script>
</body>
</html>
