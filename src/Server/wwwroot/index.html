<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES Oracle DB Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@300;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/logger-service.js"></script>
</head>

<body>
    <div class="decoration blob-1"></div>
    <div class="decoration blob-2"></div>

    <div class="container">
        <div class="glass-card">
            <h1>Oracle DB Connection</h1>
            <p class="subtitle">접속 정보를 입력하고 연동을 테스트하세요.</p>

            <form id="dbForm">
                <div class="row">
                    <div class="input-group">
                        <label>IP (Host)</label>
                        <input type="text" id="host" placeholder="localhost" required value="localhost">
                    </div>
                    <div class="input-group">
                        <label>Port</label>
                        <input type="number" id="port" placeholder="1521" required value="1521">
                    </div>
                </div>

                <div class="row">
                    <div class="input-group">
                        <label>아이디 (User ID)</label>
                        <input type="text" id="userId" placeholder="system" required value="system">
                    </div>
                    <div class="input-group">
                        <label>비밀번호 (Password)</label>
                        <input type="text" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="input-group" style="margin-top: 0.5rem;">
                    <label>서비스 이름 (Service Name)</label>
                    <input type="text" id="serviceName" placeholder="FREE" required value="FREE">
                </div>

                <button type="submit" id="testBtn">연결 (Connection Test)</button>
            </form>

            <div class="monitor-link">
                <button type="button" class="btn-outline" onclick="LogManager.openMonitor()">실시간 모니터링 창 열기 (Launch Monitor)</button>
            </div>

            <div id="result"></div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
