<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES Real-time Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/log.css">
</head>
<body>
    <div class="monitor-wrapper">
        <header>
            <div class="title-area">
                <div class="led-indicator active"></div>
                <h1>SYSTEM MONITOR</h1>
                <span class="status-text">LIVE</span>
            </div>
            <div class="window-controls">
                <button id="clearBtn">Clear</button>
                <div class="timestamp" id="currentTime">00:00:00</div>
            </div>
        </header>

        <main id="logContainer">
            <div class="log-entry system">
                <span class="entry-time">[16:33:45]</span>
                <span class="entry-msg">Monitoring system initialized...</span>
            </div>
        </main>

        <footer>
            <div class="info">CHANNEL: MES_LOG_CH</div>
            <div class="copyright">© 2026 MES Dashboard</div>
        </footer>
    </div>

    <script>
        // 현재 시간 업데이트
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleTimeString('ko-KR', { hour12: false });
        }
        setInterval(updateTime, 1000);
        updateTime();

        const logContainer = document.getElementById('logContainer');
        const clearBtn = document.getElementById('clearBtn');

        // 로그창 비우기
        clearBtn.addEventListener('click', () => {
            logContainer.innerHTML = '<div class="log-entry system"><span class="entry-time">[' + new Date().toLocaleTimeString('ko-KR', { hour12: false }) + ']</span><span class="entry-msg">Console cleared.</span></div>';
        });

        // BroadcastChannel 통신 대기
        const bc = new BroadcastChannel('mes_log_channel');
        bc.onmessage = (event) => {
            const { message, type, time } = event.data;
            appendLog(message, type, time);
        };

        function appendLog(message, type = 'info', time) {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            
            const timestamp = time || new Date().toLocaleTimeString('ko-KR', { hour12: false });
            
            entry.innerHTML = `
                <span class="entry-time">[${timestamp}]</span>
                <span class="entry-msg">${message}</span>
            `;
            
            logContainer.appendChild(entry);
            
            // 자동 스크롤
            logContainer.scrollTop = logContainer.scrollHeight;
            
            // 너무 많은 로그가 쌓이지 않도록 관리 (최근 500개 유지)
            if (logContainer.children.length > 500) {
                logContainer.removeChild(logContainer.firstChild);
            }
        }
    </script>
</body>
</html>
