<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES Schema Manager - Oracle DB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/manager_schemas.css">
    <script src="js/logger-service.js"></script>
</head>
<body>
    <div class="decoration blob-1"></div>
    <div class="decoration blob-2"></div>

    <div id="manager-container" class="dashboard-container">
        <aside class="sidebar glass-card">
            <div class="sidebar-header"><h3>Schema Manager</h3></div>
            <nav class="menu"><button class="menu-item active"><span class="icon">🆔</span><span>스키마 목록</span></button></nav>
            <div class="sidebar-footer"><button class="btn-outline-sm" onclick="location.href='debug_navigator.html'">뒤로 가기 (Back)</button></div>
        </aside>

        <main class="main-content glass-card">
            <div class="content-header">
                <h2>데이터베이스 스키마 조회</h2>
                <p class="subtitle">Oracle에 등록된 사용자(User) 목록을 확인합니다.</p>
            </div>

            <div class="fixed-table-header">
                <table class="table-list">
                    <thead>
                        <tr>
                            <th class="col-idx">#</th>
                            <th>스키마 이름 (USERNAME / ID)</th>
                            <th class="col-action">작업</th>
                        </tr>
                    </thead>
                </table>
            </div>

            <div class="table-scroll-area" id="table-scroll-container">
                <table class="table-list">
                    <tbody id="schema-body">
                        <tr><td colspan="3" class="empty-message">조회 버튼을 눌러주세요.</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="action-bar">
                <button class="btn-primary" id="btn-fetch-schemas" style="width: auto; padding: 12px 40px;">조회 (Refresh)</button>
            </div>
        </main>
    </div>

    <!-- 외부 모달이 삽입될 위치 -->
    <div id="modal-placeholder"></div>

    <script src="js/modal_edit_schema.js"></script>
    <script src="js/manager_schemas.js"></script>
</body>
</html>
