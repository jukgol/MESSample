<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - MES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="decoration blob-1"></div>
    <div class="main-container">
        <header>
            <h1>👤 User Management</h1>
            <p class="subtitle">시스템 사용자 계정 및 권한을 관리합니다.</p>
        </header>

        <div class="content-wrapper">
            <!-- 왼쪽: 사용자 목록 -->
            <aside class="user-sidebar glass-card">
                <div class="sidebar-header">
                    <h3>User List</h3>
                </div>
                <div id="user-list" class="user-list">
                    <!-- 사용자 목록이 동적으로 삽입됨 -->
                </div>
                <div class="sidebar-footer">
                    <button id="btn-add-user" class="btn-primary">
                        <span class="icon">+</span> New User
                    </button>
                </div>
            </aside>

            <!-- 오른쪽: 상세 정보 및 수정 -->
            <main class="user-detail glass-card">
                <div id="form-container">
                    <div class="form-header">
                        <h3 id="form-title">Select a user to edit</h3>
                    </div>
                    <form id="user-form" class="user-form">
                        <input type="hidden" id="user-id">
                        
                        <div class="form-group">
                            <label for="login-id">Login ID</label>
                            <input type="text" id="login-id" required placeholder="Enter login ID">
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="text" id="password" required placeholder="Enter password">
                        </div>

                        <div class="form-group">
                            <label for="user-name">User Name</label>
                            <input type="text" id="user-name" required placeholder="Enter full name">
                        </div>

                        <div class="form-group">
                            <label for="role-code">Role</label>
                            <select id="role-code" required>
                                <option value="">Select Role</option>
                                <!-- 역할 목록이 동적으로 삽입됨 -->
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="is-active">Status</label>
                            <select id="is-active" required>
                                <option value="Y">Active</option>
                                <option value="N">Inactive</option>
                            </select>
                        </div>

                        <div class="form-actions">
                            <button type="submit" id="btn-save" class="btn-success">Create</button>
                            <button type="button" id="btn-random" class="btn-info" style="display:none;">Random</button>
                            <button type="button" id="btn-delete" class="btn-danger" style="display:none;">Delete User</button>
                        </div>
                    </form>
                </div>
                <div id="empty-state" class="empty-state">
                    <div class="empty-icon">👤</div>
                    <p>사용자를 선택하거나 새 사용자를 추가하세요.</p>
                </div>
            </main>
        </div>
    </div>
    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
</body>
</html>
