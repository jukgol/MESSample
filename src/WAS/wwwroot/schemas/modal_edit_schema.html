<!-- [팝업 UI] 스키마 정보 수정 모달 -->
<div id="edit-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3>스키마 정보 수정</h3>
        </div>
        <div class="modal-body">
            <div class="modal-body-container">
                <!-- 왼쪽: 기존 권한 정보 -->
                <div class="modal-body-left">
                    <p id="modal-schema-name" style="font-weight: 600; color: #818cf8; margin-bottom: 20px; font-size: 1.1rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;"></p>
                    <div id="privs-container" style="max-height: 350px; overflow-y: auto; border-radius: 12px; background: rgba(0,0,0,0.2);">
                        <table class="table-list" style="font-size: 0.85rem;">
                            <thead>
                                <tr>
                                    <th style="padding: 10px;">구분</th>
                                    <th style="padding: 10px;">권한 / 역할 명칭</th>
                                </tr>
                            </thead>
                            <tbody id="modal-privs-body">
                                <!-- JS에서 권한 목록을 채워넣음 -->
                            </tbody>
                        </table>
                    </div>
                </div>
                
                <!-- 오른쪽: SQL 스크립트 목록 -->
                <div class="modal-body-right" id="modal-system-section">
                    <p style="font-weight: 600; color: #10b981; margin-bottom: 10px; font-size: 0.9rem;">Setup 스크립트 목록</p>
                    <div id="setup-scripts-container" style="flex: 1; background: rgba(0, 0, 0, 0.3); border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); overflow-y: auto; max-height: 400px;">
                        <ul id="setup-scripts-list" style="list-style: none; padding: 0; margin: 0;">
                            <!-- JS에서 스크립트 목록을 채워넣음 -->
                            <li style="padding: 15px; text-align: center; color: rgba(255,255,255,0.2); font-style: italic;">스크립트 로딩 중...</li>
                        </ul>
                    </div>
                    <p style="font-size: 0.75rem; color: rgba(255,255,255,0.3); margin-top: 10px;">* Setup 디렉토리에 등록된 관리용 쿼리 목록입니다.</p>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-outline-sm" style="width: auto; padding: 8px 25px;" onclick="closeModal()">취소</button>
            <button class="btn-primary" style="width: auto; padding: 8px 35px;" onclick="closeModal()">저장</button>
        </div>
    </div>
</div>
